<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kay — illustrated avatar">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#6b443d" opacity="0.07"/>
    </pattern>
    <clipPath id="screen"><rect x="126" y="132" width="260" height="148"/></clipPath>
    <path id="ring" d="M256 60 L442 195 L371 415 L141 415 L70 195 Z"/>
  </defs>

  <rect width="512" height="512" fill="#f7f1e8"/>
  <rect width="512" height="512" fill="url(#dots)"/>
  <circle cx="256" cy="300" r="126" fill="#849671" opacity="0.12"/>

  <!-- network ring -->
  <g stroke="#849671" stroke-width="1.6" fill="none" opacity="0.45">
    <use href="#ring"/>
  </g>
  <g fill="#849671">
    <circle cx="256" cy="60" r="7"/>
    <circle cx="442" cy="195" r="7"/>
    <circle cx="371" cy="415" r="7"/>
    <circle cx="141" cy="415" r="7"/>
    <circle cx="70" cy="195" r="7"/>
  </g>
  <g fill="none" stroke="#849671" stroke-width="2">
    <circle cx="256" cy="60" r="7"><animate attributeName="r" values="7;18" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="371" cy="415" r="7"><animate attributeName="r" values="7;18" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="195" r="7"><animate attributeName="r" values="7;18" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#6b443d">
    <circle r="4"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#ring"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#ring"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath href="#ring"/></animateMotion></circle>
  </g>

  <!-- terminal -->
  <rect x="126" y="104" width="260" height="176" rx="16" fill="#1c1b1a"/>
  <circle cx="146" cy="118" r="5" fill="#6b443d"/>
  <circle cx="162" cy="118" r="5" fill="#c9a227"/>
  <circle cx="178" cy="118" r="5" fill="#849671"/>
  <g clip-path="url(#screen)">
    <rect x="146" y="148" width="110" height="9" rx="4.5" fill="#849671" opacity="0.8"/>
    <rect x="146" y="166" width="152" height="9" rx="4.5" fill="#f7f1e8" opacity="0.5"/>
    <rect x="162" y="184" width="96" height="9" rx="4.5" fill="#6b443d" opacity="0.9"/>
    <rect x="162" y="202" width="130" height="9" rx="4.5" fill="#f7f1e8" opacity="0.4"/>
    <rect x="146" y="220" width="70" height="9" rx="4.5" fill="#849671" opacity="0.8"/>
    <rect x="224" y="232" width="9" height="14" fill="#f7f1e8">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="146" y="256" width="226" height="8" rx="4" fill="#f7f1e8" opacity="0.14"/>
    <rect x="146" y="256" height="8" rx="4" fill="#849671">
      <animate attributeName="width" values="0;226;226;0" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="132" y="140" width="248" height="2" fill="#849671" opacity="0.35">
      <animate attributeName="y" values="140;276;140" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- figure -->
  <g>
    <rect x="246" y="346" width="20" height="18" fill="#6b443d"/>
    <path d="M178 512 L178 432 Q178 358 256 358 Q334 358 334 432 L334 512 Z" fill="#6b443d"/>
    <path d="M234 360 L256 392 L278 360 Z" fill="#f7f1e8" opacity="0.28"/>
    <circle cx="256" cy="318" r="36" fill="#6b443d"/>
    <path d="M212 322 A44 44 0 0 1 300 322" fill="none" stroke="#1c1b1a" stroke-width="9" stroke-linecap="round"/>
    <rect x="204" y="312" width="16" height="30" rx="8" fill="#1c1b1a"/>
    <rect x="292" y="312" width="16" height="30" rx="8" fill="#1c1b1a"/>
  </g>

  <!-- bolt accent -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="3.2s" repeatCount="indefinite"/>
    <path d="M424 104 L404 140 L418 140 L408 178 L438 136 L422 136 Z" fill="#849671"/>
  </g>
</svg>
