<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 300" width="1500" height="300" role="img" aria-label="Kay — Infrastructure, Networks and Embedded Systems">
  <defs>
    <pattern id="hdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#6b443d" opacity="0.06"/>
    </pattern>
    <linearGradient id="hfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#849671" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#849671" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#849671" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="300" fill="#f7f1e8"/>
  <rect width="1500" height="300" fill="url(#hdots)"/>

  <!-- decorative network lines -->
  <g stroke="url(#hfade)" stroke-width="1.5" fill="none">
    <path d="M60 236 L188 200 L316 236"/>
    <path d="M1184 236 L1312 200 L1440 236"/>
  </g>
  <g fill="#849671" opacity="0.75">
    <circle cx="60" cy="236" r="4"/><circle cx="188" cy="200" r="4"/><circle cx="316" cy="236" r="4"/>
    <circle cx="1184" cy="236" r="4"/><circle cx="1312" cy="200" r="4"/><circle cx="1440" cy="236" r="4"/>
  </g>

  <!-- wordmark -->
  <g>
    <text x="750" y="150" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif"
          font-size="118" font-weight="400" fill="#1c1b1a" letter-spacing="-1">Kay</text>
    <circle cx="866" cy="136" r="12" fill="#6b443d">
      <animate attributeName="r" values="12;14.5;12" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- tagline -->
  <text x="750" y="204" text-anchor="middle" font-family="Inter, system-ui, 'Segoe UI', sans-serif"
        font-size="26" font-weight="500" fill="#6f6c66" letter-spacing="7">INFRASTRUCTURE · NETWORKS · EMBEDDED</text>

  <!-- underline rule -->
  <rect x="600" y="234" width="300" height="2" rx="1" fill="#e1dcd3"/>
</svg>
